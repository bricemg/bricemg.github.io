<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRICEMG / CMS WYSIWYG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Doto:wght@300;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="css/admin-sections.css" />
</head>

<body>
  <!-- Auth screen if not logged in -->
  <div id="authPanel" class="auth-panel">
    <h2>CMS Studio</h2>
    <p style="font-size: 11px; color: var(--ink-soft); margin-bottom: 20px;">
      Entrez votre clé d'accès pour activer le mode d'édition WYSIWYG.
    </p>
    <div class="field">
      <label for="secret">Clé d'accès</label>
      <input id="secret" type="password" placeholder="Clé d'accès (défaut : bricemg)" />
    </div>
    <div class="actions">
      <button id="loginBtn">Ouvrir le Mode CMS</button>
    </div>
  </div>
  <!-- Live WYSIWYG Studio -->
  <div id="cmsContainer" class="hidden">
    <!-- Left Side CMS Sidebar -->
    <aside id="cmsSidebar" class="cms-sidebar" aria-label="CMS Navigation et Réglages">
      <div class="cms-sidebar-header">
        <div class="cms-sidebar-brand">
          <span class="cms-dot-pulse"></span>
          <span>CMS WYSIWYG</span>
        </div>
        <button id="collapseSidebarBtn" class="cms-sidebar-toggle-btn" type="button"
          title="Réduire le panneau (Masquer)">
          Réduire
        </button>
      </div>
      <div class="cms-sidebar-body">
        <!-- 1. ACTION -->
        <div class="cms-sidebar-section">
          <div class="cms-sidebar-section-title">Action</div>
          <div class="cms-action-buttons">
            <button id="saveBtn" class="cms-sidebar-btn primary" type="button"
              title="Enregistrer localement (localStorage)">
              Enregistrer (Local)
            </button>
            <button id="exportBtn" class="cms-sidebar-btn primary" type="button"
              title="Télécharger le fichier content.json pour Git"
              style="background: var(--red); border-color: var(--red); color: #fff;">
              Exporter content.json
            </button>
            <button id="togglePreviewBtn" class="cms-sidebar-btn" type="button"
              title="Masquer les outils pour voir le rendu visiteur exact">
              Aperçu Direct
            </button>
            <button id="resetBtn" class="cms-sidebar-btn secondary" type="button"
              title="Réinitialiser tout le site par défaut">
              Réinitialiser
            </button>
            <a href="index.html" class="cms-sidebar-btn link-btn" target="_blank" title="Ouvrir le site visiteur">
              Voir le site
            </a>
          </div>
        </div>
        <!-- 2. COULEUR DU THÈME -->
        <div class="cms-sidebar-section">
          <div class="cms-sidebar-section-title">Couleur du thème</div>
          <div class="field">
            <label>Couleur de fond (Page)</label>
            <div class="color-picker-row">
              <input id="themeBgPicker" class="color-swatch" type="color" value="#e3e3e3" />
              <input id="themeBg" type="text" value="#e3e3e3" placeholder="#e3e3e3" />
            </div>
          </div>
          <div class="field">
            <label>Couleur des cartes / blocs</label>
            <div class="color-picker-row">
              <input id="themeCellPicker" class="color-swatch" type="color" value="#f0f0f0" />
              <input id="themeCell" type="text" value="#f0f0f0" placeholder="#f0f0f0" />
            </div>
          </div>
          <div class="field">
            <label>Couleur du contour / séparateurs</label>
            <div class="color-picker-row">
              <input id="themeBorderPicker" class="color-swatch" type="color" value="#d8d8d8" />
              <input id="themeBorder" type="text" value="#d8d8d8" placeholder="#d8d8d8" />
            </div>
          </div>
          <div class="field">
            <label>Couleur du texte principal</label>
            <div class="color-picker-row">
              <input id="themeTextPicker" class="color-swatch" type="color" value="#2e2e2e" />
              <input id="themeText" type="text" value="#2e2e2e" placeholder="#2e2e2e" />
            </div>
          </div>
          <div class="field">
            <label>Couleur du texte secondaire</label>
            <div class="color-picker-row">
              <input id="themeTextSoftPicker" class="color-swatch" type="color" value="#585858" />
              <input id="themeTextSoft" type="text" value="#585858" placeholder="#585858" />
            </div>
          </div>
          <div class="field">
            <label>Couleur du texte discret</label>
            <div class="color-picker-row">
              <input id="themeTextFaintPicker" class="color-swatch" type="color" value="#9b9b9b" />
              <input id="themeTextFaint" type="text" value="#9b9b9b" placeholder="#9b9b9b" />
            </div>
          </div>
          <div class="field">
            <label>Couleur d'accent (Pastilles & détails)</label>
            <div class="color-picker-row">
              <input id="themeAccentPicker" class="color-swatch" type="color" value="#d71921" />
              <input id="themeAccent" type="text" value="#d71921" placeholder="#d71921" />
            </div>
          </div>
          <label class="cms-field-sub">Palettes rapides</label>
          <div class="preset-buttons">
            <button type="button" class="preset-btn" data-preset="default">Studio Gris</button>
            <button type="button" class="preset-btn" data-preset="dark">Dark Minimal</button>
            <button type="button" class="preset-btn" data-preset="white">Pur Blanc</button>
            <button type="button" class="preset-btn" data-preset="warm">Sépia Papier</button>
            <button type="button" class="preset-btn" data-preset="cyber">Matrix / Vert</button>
          </div>
        </div>
        <!-- 3. INFORMATION DU SITE -->
        <div class="cms-sidebar-section">
          <div class="cms-sidebar-section-title">Information du site</div>
          <div class="field">
            <label>Nom du site</label>
            <input id="siteTitle" type="text" value="BRICEMG / STUDIO" />
          </div>
          <div class="field">
            <label>Sous-titre</label>
            <input id="siteSubtitle" type="text" value="DESIGN / CODE / VISION" />
          </div>
          <div class="field">
            <label>Phrase d'accueil (Hero Claim)</label>
            <textarea id="heroClaim">DES IDÉES QUI ONT UNE FORME, UNE VOIX ET UNE VITESSE.</textarea>
          </div>
          <div class="field">
            <label>Introduction</label>
            <textarea
              id="intro">Je crée des interfaces, des identités visuelles et des expériences web qui donnent du sens à une idée.</textarea>
          </div>
          <div class="field">
            <label>À propos</label>
            <textarea
              id="about">Je conçois et développe des projets à la croisée du design, du produit et du code.</textarea>
          </div>
          <div class="field">
            <label>Email de contact</label>
            <input id="email" type="email" value="bonjour@bricemg.dev" />
          </div>
          <label class="cms-field-sub">Cards F, G, H (Plates bas de page)</label>
          <div class="field">
            <label>Carte F (Titre / Label)</label>
            <input id="plateFLabel" type="text" value="INFO" />
          </div>
          <div class="field">
            <label>Carte F (Texte 1 - ÉTAT)</label>
            <textarea id="plateFText1">CRÉATION D'UNE BASE VISUELLE ET D'UNE PREMIÈRE VERSION D'EXPOSITION.</textarea>
          </div>
          <div class="field">
            <label>Carte F (Texte 2 - FOCUS)</label>
            <textarea id="plateFText2">DESIGN, DÉVELOPPEMENT, EXPÉRIMENTATION ET STORYTELLING.</textarea>
          </div>
          <div class="field">
            <label>Carte G (Titre / Label)</label>
            <input id="plateGLabel" type="text" value="APPROCHE" />
          </div>
          <div class="field">
            <label>Carte G (Texte 1 - PRINCIPE)</label>
            <textarea id="plateGText1">CLARTÉ, RYTHME, STRUCTURE ET PLAINES DE COULEUR.</textarea>
          </div>
          <div class="field">
            <label>Carte G (Texte 2 - MOOD)</label>
            <textarea id="plateGText2">MINIMAL, CALME, MODERNE, UN PEU TECHNIQUE ET CURIEUX.</textarea>
          </div>
          <div class="field">
            <label>Carte H (Titre / Label)</label>
            <input id="plateHLabel" type="text" value="CONTACT" />
          </div>
          <div class="field">
            <label>Carte H (Texte de contact)</label>
            <textarea id="plateHText">POUR UN PROJET, UNE COLLABORATION, OU UNE DISCUSSION.</textarea>
          </div>
          <label class="cms-field-sub">Pied de page (Footer)</label>
          <div class="field">
            <label>Footer - Colonne 1</label>
            <input id="footerCol1" type="text" value="BRICEMG" />
          </div>
          <div class="field">
            <label>Footer - Colonne 2</label>
            <input id="footerCol2" type="text" value="DESIGN / CODE / VISION" />
          </div>
          <div class="field">
            <label>Footer - Colonne 3</label>
            <input id="footerCol3" type="text" value="DESIGN / CODE / VISION" />
          </div>
          <div class="field">
            <label>Footer - Colonne 4 (Email)</label>
            <input id="footerCol4" type="text" value="bonjour@bricemg.dev" />
          </div>
          <div class="field">
            <label>Footer - Colonne 5 (Copyright)</label>
            <input id="footerCol5" type="text" value="© 2026" />
          </div>
        </div>
      </div>
    </aside>
    <!-- Expand Trigger Button -->
    <button id="expandSidebarBtn" class="cms-expand-trigger hidden" type="button" title="Déplier le panneau CMS">
      <span>►</span>
      <span>MENU CMS</span>
    </button>
    <!-- Confirmation Modal -->
    <div id="confirmModal" class="cms-modal-backdrop" role="dialog" aria-modal="true">
      <div class="cms-modal-box">
        <div class="cms-modal-tag">VALIDATION REQUISE</div>
        <h4 id="confirmTitle" class="cms-modal-title">SUPPRIMER CET ÉLÉMENT ?</h4>
        <p id="confirmText" class="cms-modal-text">Cette action est irréversible.</p>
        <div class="cms-modal-actions">
          <button id="confirmCancelBtn" type="button" class="secondary">Annuler</button>
          <button id="confirmActionBtn" type="button" class="cms-modal-confirm-btn">Supprimer</button>
        </div>
      </div>
    </div>
    <!-- Toast Feedback -->
    <div id="cmsToast" class="cms-toast">Modifié avec succès</div>
    <!-- Main Live WYSIWYG Workspace -->
    <main id="cmsWorkspace" class="cms-workspace">
      <div id="app"></div>
    </main>
  </div>
  <!-- Scripts -->
  <script src="js/utils/storage.js"></script>
  <script src="js/templates/page.js"></script>
  <script src="js/animation/canvas.js"></script>
  <script src="js/admin/wysiwyg.js"></script>
</body>

</html>
